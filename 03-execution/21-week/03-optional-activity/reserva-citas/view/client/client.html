<section class="grid-layout">
  <!-- Formulario de Cliente -->
  <div class="card">
    <h2>Registrar Cliente</h2>
    <form id="form-client">
      <div class="form-group">
        <label for="client-type-doc">Tipo de Documento</label>
        <select id="client-type-doc" required>
          <option value="">Seleccione...</option>
          <option value="CC">Cédula de Ciudadanía (CC)</option>
          <option value="TI">Tarjeta de Identidad (TI)</option>
          <option value="CE">Cédula de Extranjería (CE)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="client-doc">Número de Documento</label>
        <input type="text" id="client-doc" placeholder="Ej: 10203040" required />
      </div>

      <div class="form-group">
        <label for="client-name">Nombre Completo</label>
        <input type="text" id="client-name" placeholder="Ej: Ana Gómez" required />
      </div>

      <div class="form-group">
        <label for="client-address">Dirección</label>
        <input type="text" id="client-address" placeholder="Ej: Calle 12 # 34-56" required />
      </div>

      <div class="form-group">
        <label for="client-phone">Teléfono</label>
        <input type="tel" id="client-phone" placeholder="Ej: 3001234567" required />
      </div>

      <div class="form-group">
        <label for="client-email">Correo Electrónico</label>
        <input type="email" id="client-email" placeholder="Ej: ana@correo.com" required />
      </div>

      <p id="client-msg" class="msg"></p>
      <button type="submit" class="btn-primary">Guardar Cliente</button>
    </form>
  </div>

  <!-- Tabla de Clientes -->
  <div class="card">
    <h2>Lista de Clientes</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="table-clients"></tbody>
      </table>
    </div>
  </div>
</section>
