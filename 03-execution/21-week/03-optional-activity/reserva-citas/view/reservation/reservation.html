<section class="grid-layout">
  <!-- Formulario de Reserva -->
  <div class="card">
    <h2>Generar Reserva de Cita</h2>
    <form id="form-reservation">
      <div class="form-group">
        <label for="res-client-id">Seleccionar Cliente (client_id)</label>
        <select id="res-client-id" required>
          <option value="">Seleccione un cliente...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="res-name">Nombre de la Cita</label>
        <input type="text" id="res-name" placeholder="Ej: Consulta General" required />
      </div>

      <div class="form-group">
        <label for="res-description">Descripción / Motivo</label>
        <textarea id="res-description" rows="3" placeholder="Detalle de la reserva..." required></textarea>
      </div>

      <p id="res-msg" class="msg"></p>
      <button type="submit" class="btn-primary">Crear Reserva</button>
    </form>
  </div>

  <!-- Tabla de Reservas -->
  <div class="card">
    <h2>Citas Reservadas</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID Cita</th>
            <th>Nombre Cita</th>
            <th>Descripción</th>
            <th>ID Cliente</th>
            <th>Nombre Cliente</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="table-reservations"></tbody>
      </table>
    </div>
  </div>
</section>
